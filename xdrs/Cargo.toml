[package]
name = "xdrs"
description = "XDR encoding"
authors = ["LazyMechanic <asharnrus@gmail.com>"]
license = "MIT OR Apache-2.0"
version = "0.1.0"
repository = "https://github.com/LazyMechanic/xdrs"
documentation = "https://docs.rs/xdrs"
